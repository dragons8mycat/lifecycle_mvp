name: Deploy to GitHub Pages
on:
  push:
    branches: [main]

# Necessary permissions for GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
          
      - name: Build
        run: |
          # CI=false ensures that minor linting warnings do not stop the build
          export CI=false
          # The --base flag MUST match your repository name on GitHub
          npm run build -- --base=/lifecycle_mvp/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
