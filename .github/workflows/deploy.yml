name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # This environment variable tells GitHub to use Node 24 for the action runners
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install Dependencies
        run: |
          npm install
          # Verify firebase is installed to debug resolution errors
          npm list firebase || echo "Firebase not found in package.json"
          
      - name: Build
        run: |
          # We set CI=false to prevent lint warnings from stopping the build in production
          # We use --emptyOutDir to ensure a clean build
          CI=false npm run build
          
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist